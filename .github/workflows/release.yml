name: Desktop-Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
          - name: Linux x64
            platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Ubuntu 22.04 ist bewusst die Linux-Basis: Dadurch bleiben die Pakete
      # mit möglichst vielen aktuellen Debian-/Ubuntu-Systemen kompatibel.
      - name: Linux-Systemabhängigkeiten installieren
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Builds zwischenspeichern
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Tag und App-Version vergleichen
        run: node -e "const version = require('./apps/desktop/src-tauri/tauri.conf.json').version; const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' passt nicht zur App-Version ' + version); process.exit(1); }"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Pakete signieren und Release-Entwurf erstellen
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "Werkstatt Motion v__VERSION__"
          releaseBody: |
            Installationsdateien für Werkstatt Motion:

            - Windows x64: `.exe`
            - Linux x64 (Debian, Ubuntu, Linux Mint): `.deb`
            - Linux x64 (weitere Distributionen): `.AppImage`

            Vor jedem automatischen Update erstellt die App ein Sicherheits-Backup
            im Anwendungsdatenverzeichnis des Betriebssystems.
          # Unveränderliche GitHub-Releases dürfen nach der Veröffentlichung
          # keine neuen Assets mehr annehmen. Deshalb zuerst den vollständigen
          # Entwurf inklusive aller Pakete, Signaturen und latest.json erzeugen.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
